name: OpenInput
options:
  bundleIdPrefix: com.x0c
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      # 对外分发：Developer ID 签名、加固运行时与可信时间戳缺一不可。
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: SHZQ3MWP3B
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # 禁止把调试权限注入发布包，否则苹果公证会拒绝。
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  MacKit:
    url: https://github.com/x0c/mac-kit-swift
    from: "0.1.0"
targets:
  OpenInput:
    type: application
    platform: macOS
    sources:
      - path: OpenInput
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x0c.openinput
        PRODUCT_NAME: OpenInput
        INFOPLIST_FILE: OpenInput/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenInput/Resources/OpenInput.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "6"
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
      - package: MacKit
        product: MacKitCore
      - package: MacKit
        product: MacKitLaunchAtLogin
      - package: MacKit
        product: MacKitLifecycle
    info:
      path: OpenInput/Resources/Info.plist
      properties:
        CFBundleName: OpenInput
        CFBundleDisplayName: 智能输入小窗
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 x0c"
        NSAccessibilityUsageDescription: OpenInput 需要辅助功能权限，以便将编辑好的文本粘贴回您原先所在的输入框。
        NSMicrophoneUsageDescription: OpenInput 需要使用麦克风，以便把您说的话转成文字填进小窗。
        # XcodeGen 会据此生成最终发布版的 Info.plist；不得只改资源目录里的生成文件。
        SUFeedURL: https://github.com/x0c/OpenInput/releases/latest/download/appcast.xml
        SUPublicEDKey: "BuNZQqosY0Ro5noXRLDCoO1X7nkpEzZ0Kr6itZLcge0="
